<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToyStore - Điều Hướng Hệ Thống</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
    }
    .router-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .logo-badge {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #e11d48, #be123c);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      color: white;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(225, 29, 72, 0.4);
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #e11d48;
      animation: spin 0.8s ease-in-out infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .quick-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
      border-top: 1px solid #334155;
      padding-top: 18px;
    }
    .quick-link-btn {
      display: block;
      padding: 10px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .btn-admin { background: #3b82f6; color: white; }
    .btn-manager { background: #e11d48; color: white; }
    .btn-customer { background: #334155; color: #cbd5e1; }
    .quick-link-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="router-card">
    <div class="logo-badge">T</div>
    <h1>ToyStore Management</h1>
    <div class="spinner"></div>
    <p id="routingStatus">Đang xác thực quyền hạn và chuyển hướng cổng làm việc...</p>

    <div class="quick-links" id="fallbackLinks" style="display:none;">
      <a href="/admin.html" class="quick-link-btn btn-admin">Vào Cổng Admin (Quản trị hệ thống)</a>
      <a href="/manager.html" class="quick-link-btn btn-manager">Vào Cổng Manager (Quản lý cửa hàng)</a>
      <a href="/customer.html" class="quick-link-btn btn-customer">Vào Trang Store Khách Hàng</a>
    </div>
  </div>

  <script>
    (function route() {
      const token = localStorage.getItem('toyStoreToken') || localStorage.getItem('token') || sessionStorage.getItem('token');
      const user = JSON.parse(localStorage.getItem('toyStoreUser') || 'null');
      const role = String(user?.role || '').trim().toLowerCase();

      if (!token || !user) {
        location.replace('/customer.html');
        return;
      }

      if (role === 'admin') {
        location.replace('/admin.html' + location.hash);
      } else if (role === 'manager' || role === 'staff') {
        location.replace('/manager.html' + location.hash);
      } else if (role === 'shipper') {
        location.replace('/shipper.html');
      } else {
        location.replace('/customer.html');
      }

      // Sau 2.5s nếu trình duyệt chặn chuyển hướng tự động thì hiển thị nút bấm thủ công
      setTimeout(() => {
        document.getElementById('fallbackLinks').style.display = 'flex';
        document.getElementById('routingStatus').textContent = 'Chọn cổng làm việc phù hợp với vai trò của bạn:';
      }, 2500);
    })();
  </script>
</body>
</html>
