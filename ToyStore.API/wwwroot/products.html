<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff9f0">
    <title>ToyStore - Sản phẩm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/customer.css">
    <link rel="stylesheet" href="/css/catalog.css">
    <link rel="stylesheet" href="/css/catalog-reference.css">
    <style>
        .customer-api-status { font-size: 11px; font-weight: 700; color: #9b6b18 }
        .customer-api-status.online { color: #24724e }
        .customer-api-status.offline { color: #b44235 }
        .catalog-content .product-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; padding-top: 24px }
        .catalog-content .product-card { min-width: 0; max-width: 230px; margin: 0 auto; overflow: hidden }
        .catalog-content .product-img { height: 155px; aspect-ratio: auto }
        .catalog-content .product-img img { width: 100%; height: 100%; object-fit: cover }
        .catalog-content .product-detail { padding: 10px 11px }
        .catalog-content .product-detail h3 { font-size: 14px; line-height: 1.25; margin: 5px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 35px }
        .catalog-content .product-price b { font-size: 14px }
        .product-pagination { display: flex; justify-content: center; gap: 8px; margin: 30px 0 10px }
        .page-button { min-width: 36px; height: 36px; border: 1px solid #e7e9e3; background: #fff; border-radius: 6px; cursor: pointer }
        .page-button.active { background: #173f35; color: #fff; border-color: #173f35 }

        /* CHECKBOX STYLE */
        .filter-checkbox { display: flex; align-items: center; gap: 10px; cursor: pointer; color: #333; font-size: 14px; padding: 4px 0; transition: color 0.2s; }
        .filter-checkbox input[type="checkbox"] {
            width: 18px; height: 18px; cursor: pointer; accent-color: #d7082f;
            appearance: auto; -webkit-appearance: checkbox;
        }
        .filter-checkbox:hover { color: #d7082f; }
        .filter-section { border-bottom: 1px solid #f0f0f0; padding-bottom: 15px; margin-bottom: 15px; }
        .sidebar-title { display: flex; justify-content: space-between; align-items: center; font-size: 14px; text-transform: uppercase; font-weight: 700; margin-bottom: 10px; color: #173f35; }
        .clear-filters { width: 100%; border: 1px solid #d7082f; background: #fff; color: #d7082f; border-radius: 6px; padding: 10px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
        .clear-filters:hover { background: #d7082f; color: #fff; }

        @media(max-width:900px) { .catalog-content .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
    </style>
</head>
<body>
    <div class="announcement">Miễn phí giao hàng cho đơn từ 500.000đ <span>✦</span> Đổi trả trong 7 ngày</div>
    <header class="store-header">
        <div class="header-inner">
            <a class="store-logo" href="/customer.html"><span class="logo-mark">T</span><span>ToyStore<span class="logo-dot">.</span></span></a>
            <nav class="store-nav"><a href="/products.html">Sản phẩm</a><a href="/customer.html#categories">Danh mục</a><a href="/customer.html#about">Về ToyStore</a></nav>
            <div class="header-actions">
                <span class="customer-api-status" id="customerApiStatus">Đang kết nối API</span>
                <button class="header-icon">⌕</button><button class="cart-button"><span>♧</span><i id="cartCount">0</i></button>
            </div>
        </div>
    </header>

    <main class="catalog-page">
        <aside class="catalog-sidebar">
            <!-- CATEGORY -->
            <div class="filter-section">
                <div class="sidebar-title"><b>Danh mục</b></div>
                <div class="category-list" id="categoryList">Đang tải...</div>
            </div>

            <!-- PRICE -->
            <div class="filter-section">
                <div class="sidebar-title"><b>Khoảng giá</b></div>
                <div class="checkbox-list">
                    <label class="filter-checkbox"><input type="checkbox" class="price-filter" value="0-100000"> <span>Dưới 100.000đ</span></label>
                    <label class="filter-checkbox"><input type="checkbox" class="price-filter" value="100000-300000"> <span>100.000đ - 300.000đ</span></label>
                    <label class="filter-checkbox"><input type="checkbox" class="price-filter" value="300000-500000"> <span>300.000đ - 500.000đ</span></label>
                    <label class="filter-checkbox"><input type="checkbox" class="price-filter" value="500000-1000000"> <span>500.000đ - 1.000.000đ</span></label>
                    <label class="filter-checkbox"><input type="checkbox" class="price-filter" value="1000000-2000000"> <span>1.000.000đ - 2.000.000đ</span></label>
                    <label class="filter-checkbox"><input type="checkbox" class="price-filter" value="2000000-999999999"> <span>Trên 2.000.000đ</span></label>
                </div>
            </div>

            <!-- BRAND -->
            <div class="filter-section">
                <div class="sidebar-title"><b>Thương hiệu</b></div>
                <div class="checkbox-list" id="brandFilterList">Đang tải...</div>
            </div>

            <!-- GENDER -->
            <div class="filter-section">
                <div class="sidebar-title"><b>Giới tính</b></div>
                <div class="checkbox-list">
                    <label class="filter-checkbox"><input type="checkbox" class="gender-filter" value="1"> <span>Bé trai</span></label>
                    <label class="filter-checkbox"><input type="checkbox" class="gender-filter" value="2"> <span>Bé gái</span></label>
                    <label class="filter-checkbox"><input type="checkbox" class="gender-filter" value="3"> <span>Cả hai</span></label>
                </div>
            </div>

            <!-- AGE -->
            <div class="filter-section">
                <div class="sidebar-title"><b>Độ tuổi</b></div>
                <div class="checkbox-list">
                    <label class="filter-checkbox"><input type="checkbox" class="age-filter" value="0-12"> <span>0 - 12 tháng</span></label>
                    <label class="filter-checkbox"><input type="checkbox" class="age-filter" value="13-36"> <span>1 - 3 tuổi</span></label>
                    <label class="filter-checkbox"><input type="checkbox" class="age-filter" value="37-72"> <span>3 - 6 tuổi</span></label>
                    <label class="filter-checkbox"><input type="checkbox" class="age-filter" value="73-132"> <span>6 - 11 tuổi</span></label>
                    <label class="filter-checkbox"><input type="checkbox" class="age-filter" value="133-240"> <span>Trên 12 tuổi</span></label>
                </div>
            </div>

            <button type="button" id="clearFilters" class="clear-filters">Xóa tất cả bộ lọc</button>
        </aside>

        <section class="catalog-content">
            <div class="catalog-toolbar">
                <div><h1 id="catalogTitle">Sản phẩm</h1><span id="resultCount">0 Sản phẩm</span></div>
                <div class="catalog-toolbar-actions">
                    <input type="text" id="productSearch" placeholder="Tìm tên sản phẩm...">
                    <select id="productSort">
                        <option value="">Sắp xếp</option>
                        <option value="priceAsc">Giá tăng dần</option>
                        <option value="priceDesc">Giá giảm dần</option>
                        <option value="name">Tên A-Z</option>
                    </select>
                </div>
            </div>
            <div class="product-grid" id="productGrid"></div>
            <div class="product-pagination" id="productPagination"></div>
        </section>
    </main>

    <footer class="store-footer">
        <div class="footer-bottom"><span>© 2026 ToyStore Management</span></div>
    </footer>
    <div class="customer-toast" id="customerToast"></div>
    <script src="/js/customer.js"></script>
</body>
</html>
